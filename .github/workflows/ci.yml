name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install validation tools
        run: python -m pip install pytest ruff
      - name: Lint
        run: ruff check --select E4,E7,E9,F tests
      - name: Test
        run: python -m pytest -q
      - name: Validate notebook JSON
        run: python -m json.tool notebooks/restaurant_health_analysis.ipynb > /dev/null
